<!doctype html>
<!-- Google Play phone screenshot with a caption, 1080 × 1920: frame.html?title=…&sub=…&shot=phone/1-player.png
     puts a caption over one of the emulator screenshots in phone/ (1080 × 2400). Render it with
     headless Chrome at a 1080 × 1920 window (see ../google-play.md). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow SC"; font-weight: 600; src: url("../../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-600-normal.woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 400; src: url("../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 60% at 30% 0%, #22343d 0%, #121d23 55%, #0e171c 100%); }
  .cap { position: absolute; left: 84px; right: 84px; top: 92px; color: #e8edea; }
  h1 { font: 600 88px/1.02 "Barlow SC", sans-serif; margin: 0; letter-spacing: -0.5px; }
  p { font: 400 40px/1.3 "Barlow", sans-serif; margin: 26px 0 0; color: #8fa3a8; }
  .phone { position: absolute; left: 50%; top: 450px; transform: translateX(-50%);
    border-radius: 56px; overflow: hidden; border: 3px solid #2b414c; background: #121d23;
    box-shadow: 0 30px 90px rgba(0,0,0,.55); }
  /* A 1080 × 2400 screenshot drawn at 0.6: 648 × 1440. */
  .phone img { display: block; width: 648px; height: 1440px; }
</style>
</head>
<body>
<div class="cap"><h1 id="t"></h1><p id="s"></p></div>
<div class="phone" id="phone"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("t").textContent = q.get("title") ?? "";
  document.getElementById("s").textContent = q.get("sub") ?? "";
  const img = document.createElement("img");
  img.src = q.get("shot") ?? "phone/1-player.png";
  document.getElementById("phone").append(img);
</script>
</body>
</html>
