[package]
name = "hifi-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.44"
log = "0.4.35"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["all"] }


[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2.18"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
# Same version wasapi uses, so its COM interface types are ours too.
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "ios")'.dependencies]
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["audio_unit", "core_audio"] }
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute", "AVAudioSessionTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
ndk-context = "0.1"
