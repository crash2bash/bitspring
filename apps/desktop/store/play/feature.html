<!doctype html>
<!-- Google Play feature graphic, 1024 × 500. Render with headless Chrome (see ../google-play.md). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Barlow SC"; font-weight: 300; src: url("../../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-300-normal.woff2"); }
  @font-face { font-family: "Barlow SC"; font-weight: 500; src: url("../../node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-500-normal.woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 400; src: url("../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #121d23; }
  canvas { position: absolute; inset: 0; }
  .mark { position: absolute; left: 78px; top: 130px; width: 240px; height: 240px; border-radius: 54px;
          box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .text { position: absolute; left: 372px; top: 150px; color: #e8edea; }
  h1 { font: 500 104px/1 "Barlow SC", sans-serif; margin: 0; letter-spacing: -1px; }
  p { font: 400 30px/1.3 "Barlow", sans-serif; margin: 22px 0 0; color: #8fa3a8; }
  p b { color: #c9a45c; font-weight: 400; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="500"></canvas>
<img class="mark" src="icon-512.png" alt="">
<div class="text">
  <h1>BitSpring</h1>
  <p><b>Bit for bit.</b> Hi-res, DSD and USB DACs.</p>
</div>
<script>
  // Thin brass sample stems, like the website's hero: a soft wave across the right half.
  const ctx = document.getElementById("c").getContext("2d");
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 520; i++) {
    const x = 330 + rnd() * 720;
    const base = 250 + Math.sin(x / 95) * 40 + Math.sin(x / 31) * 12;
    const h = 30 + rnd() * 170 * (0.4 + 0.6 * ((x - 330) / 720));
    const g = ctx.createLinearGradient(0, base - h, 0, base + h * 0.6);
    const a = 0.10 + rnd() * 0.28;
    g.addColorStop(0, `rgba(201,164,92,0)`);
    g.addColorStop(0.45, `rgba(214,180,111,${a})`);
    g.addColorStop(1, `rgba(201,164,92,0)`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 0.8 + rnd() * 0.8;
    ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x, base + h * 0.6); ctx.stroke();
    ctx.fillStyle = `rgba(232,200,130,${a + 0.25})`;
    ctx.beginPath(); ctx.arc(x, base - h * 0.55, 1.1, 0, 7); ctx.fill();
  }
  // Keep the title readable: fade the stems out behind the text.
  const v = ctx.createLinearGradient(330, 0, 1024, 0);
  v.addColorStop(0, "rgba(18,29,35,0.92)"); v.addColorStop(0.62, "rgba(18,29,35,0.55)"); v.addColorStop(1, "rgba(18,29,35,0)");
  ctx.fillStyle = v; ctx.fillRect(330, 0, 694, 500);
</script>
</body>
</html>
