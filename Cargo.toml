[workspace]
resolver = "3"
members = ["crates/engine", "crates/streaming", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# DSP must keep up with realtime even in debug builds of the app.
[profile.dev.package.hifi-engine]
opt-level = 3
