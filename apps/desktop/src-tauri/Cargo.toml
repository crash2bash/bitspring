[package]
name = "hifi-desktop"
version = "0.15.0"
description = "Bit-perfect music player"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hifi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The phone remote's QR code.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hifi-engine = { version = "0.1.0", path = "../../../crates/engine" }
tauri-plugin-dialog = "2.8.4"
anyhow = "1.0.104"
base64 = "0.23.1"
sys-locale = "0.3"
# AutoEQ's headphone catalog, and Android updates (latest.json and the APK).
ureq = "3"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

# Security-scoped bookmarks: the sandboxed Mac App Store build keeps its music folders.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString", "NSURL"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
log = "0.4"
ndk-context = "0.1"



# Qobuz and TIDAL, and updating itself from GitHub Releases. On by default (DMG, Windows,
# Android); the Mac App Store build goes without both: `npm run build:appstore` (= tauri build
# with tauri.appstore.conf.json -- --no-default-features). iOS never gets either (every iPhone
# build goes through the App Store).
[features]
default = ["streaming", "updater"]
streaming = ["dep:hifi-streaming"]
updater = ["dep:tauri-plugin-updater"]

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
hifi-streaming = { path = "../../../crates/streaming", optional = true }
