[package]
name = "hifi-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.44"
log = "0.4.35"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
rustfft = "6.4.1"
# Real-input FFTs on top of rustfft (MIT): half the work and memory of the long upsampling filters.
realfft = "3.5.1"
# CUE sheets name files in NFC; macOS file names are often NFD ("й" as "и" + breve).
unicode-normalization = "0.1"
# Writing tags (the tag editor). Reading stays with symphonia.
lofty = "0.25"
# Lossless formats symphonia doesn't decode (all MIT/Apache).
ape-decoder = "0.3"
wavicle = { version = "0.1", default-features = false, features = ["decode"] }
oxideav-tta = { version = "0.0.4", default-features = false }
scarletbook = { version = "0.5", default-features = false }
# Google Cast talks TLS (ring: the provider the app's other TLS already uses).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
symphonia = { version = "0.6.1", features = ["all"] }
# Opus, which symphonia demuxes but can't decode: libopus 1.3.1 in Rust (BSD-3-Clause, no C).
unsafe-libopus = "0.2.0"


[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2.18"

[target.'cfg(windows)'.dependencies]
# ASIO output (bit-perfect PCM and native DSD). The ASIO crate is GPL-3.0-only (it uses the
# Steinberg SDK's GPLv3 option), so the Windows builds that link it are distributed under GPLv3.
bitspring-asio = { path = "../asio" }
wasapi = "0.27.0"
# Same version wasapi uses, so its COM interface types are ours too.
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "ios")'.dependencies]
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["audio_unit", "core_audio"] }
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionRoute", "AVAudioSessionTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12.1"
libc = "0.2.191"
