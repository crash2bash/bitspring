# Builds the Linux app (AppImage: runs on any distro without installing anything; .deb for
# Ubuntu/Debian), runs the engine's tests on Linux, then launches the AppImage
# on a virtual display and takes a screenshot.
# Built on Ubuntu 22.04 so the binary runs on any distro with glibc 2.35 or newer.
name: Linux app

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/linux.yml
      - crates/engine/src/linux_out.rs
      - apps/desktop/src-tauri/src/main.rs
      - apps/desktop/src-tauri/src/pad.rs
      - apps/desktop/src-tauri/src/linux_media.rs
      - apps/desktop/src/lib/gamepad.ts
      - apps/desktop/package.json # version bumps: a build for every release

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libudev-dev patchelf file \
            xvfb imagemagick x11-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # One network test is flaky on every OS (about 1 run in 6 on a Mac too): skipped here
      # until it's fixed, so it doesn't hold up Linux builds.
      - name: Engine tests
        working-directory: .
        run: cargo test -p hifi-engine --release -- --skip a_renderer_without_next_uri_starts_the_next_track_itself

      # No updater signature here (the key stays off CI); release builds are signed locally.
      - name: Build
        # The app's Last.fm key (repository secrets; see src-tauri/src/scrobble.rs). Without
        # them the build simply has no Last.fm.
        env:
          BITSPRING_LASTFM_KEY: ${{ secrets.BITSPRING_LASTFM_KEY }}
          BITSPRING_LASTFM_SECRET: ${{ secrets.BITSPRING_LASTFM_SECRET }}
        run: npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: BitSpring-linux-x86_64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

      # Launch on a virtual display without a GPU (a virtual machine's case) and look: the app
      # must show its window by itself (it draws in software when there is no GPU).
      - name: Launch
        run: |
          app=$(ls ../../target/release/bundle/appimage/*.AppImage | head -1)
          chmod +x "$app"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          ls /dev/dri 2>/dev/null || echo 'no /dev/dri: no GPU here'
          # Twice: a cold first start (AppImage unpacked, font cache built) and a warm one.
          # Each must show the main window within 90 s; the log says how long it took.
          shot() {
            local name=$1
            "$app" --appimage-extract-and-run > "$RUNNER_TEMP/$name.log" 2>&1 &
            local pid=$! t=0
            until xwininfo -root -tree | grep -q '"BitSpring"'; do
              sleep 1; t=$((t+1))
              if ! kill -0 $pid 2>/dev/null; then cat "$RUNNER_TEMP/$name.log"; echo "BitSpring ($name) quit"; exit 1; fi
              if [ $t -ge 90 ]; then cat "$RUNNER_TEMP/$name.log"; echo "no BitSpring window after 90 s ($name)"; exit 1; fi
            done
            echo "== $name: window after $t s"
            # Then until the page is drawn (the screen stops being black), up to 60 s more.
            local p=0
            until [ "$(import -window root png:- | convert - -format '%[fx:mean>0.02]' info:)" = 1 ]; do
              sleep 1; p=$((p+1))
              if [ $p -ge 60 ]; then import -window root "$RUNNER_TEMP/$name.png"; cat "$RUNNER_TEMP/$name.log"; echo "window still black 60 s later ($name)"; exit 1; fi
            done
            echo "== $name: drawn $p s after the window"
            import -window root "$RUNNER_TEMP/$name.png"
            kill $pid; sleep 2
            cat "$RUNNER_TEMP/$name.log"
          }
          shot cold
          shot warm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
